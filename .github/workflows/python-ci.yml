name: Python CI Demo

on:
  push:
    branches:
      - github-actions
      - main

  pull_request:
    branches:
      - main

jobs:
  python-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Display Python Version
        run: python --version

      - name: Validate Python Version
        run: |
          VERSION=$(python -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')")

          if [ "$VERSION" != "3.11" ]; then
            echo "::error::Invalid Python version. Expected Python 3.11 but found Python $VERSION"
            echo "## ❌ Workflow Failed" >> $GITHUB_STEP_SUMMARY
            echo "Expected Python 3.11 but found Python $VERSION" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "Python version validation passed."

      - name: Check Python Syntax
        run: |
          python -m compileall .

      - name: List Repository Files
        run: ls -la

      - name: Success Message
        run: echo "GitHub Actions workflow completed successfully!"
